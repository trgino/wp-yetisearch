name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    name: Build release zip
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Build in Docker
        run: ./bin/release-in-docker.sh

      - name: Locate zip
        id: zip
        run: |
          VERSION="$(grep -m1 'Version:' wp-yetisearch.php | sed 's/[^0-9.]//g')"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=build/wp-yetisearch-$VERSION.zip" >> "$GITHUB_OUTPUT"
          ls -la "build/wp-yetisearch-$VERSION.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wp-yetisearch-${{ steps.zip.outputs.version }}
          path: ${{ steps.zip.outputs.file }}

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "WP YetiSearch ${{ steps.zip.outputs.version }}" \
            --generate-notes \
            "${{ steps.zip.outputs.file }}"
